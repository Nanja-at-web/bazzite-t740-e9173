# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build HP t740 installer ISO

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/build-disk.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build Bazzite live installer ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Mount BTRFS container storage
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Bazzite installer payload
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE=ghcr.io/ublue-os/bazzite:stable \
            --build-arg INSTALL_IMAGE_PAYLOAD=ghcr.io/nanja-at-web/bazzite-t740-e9173:latest \
            --build-arg FLATPAK_DIR_SHORTNAME=kde_flatpaks \
            -t localhost/t740-installer:latest installer/

      - name: Show disk-space usage
        if: always()
        run: |
          sudo df -h
          sudo du -sh /mnt/podman-storage.img

      - name: Build bootable ISO
        id: build
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a
        with:
          image-ref: localhost/t740-installer:latest
          iso-dest: bazzite-t740-e9173-polaris-amd64.iso

      - name: Prepare ISO artifact
        id: artifact
        shell: bash
        run: |
          ISO_UPLOAD_DIR="${{ github.workspace }}/upload"
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ISO_NAME=$(basename "$ISO_PATH")
          mkdir -p "$ISO_UPLOAD_DIR"
          mv "$ISO_PATH" "$ISO_UPLOAD_DIR/"
          (cd "$ISO_UPLOAD_DIR" && sha256sum "$ISO_NAME" | tee "$ISO_NAME-CHECKSUM")
          echo "directory=$ISO_UPLOAD_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign ISO
        continue-on-error: true
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          ISO_UPLOAD_DIR: ${{ steps.artifact.outputs.directory }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "${key_dir}"' EXIT
          printf '%s' "${COSIGN_PRIVATE_KEY}" > "${key_dir}/source.key"

          (
            cd "${key_dir}"
            COSIGN_PASSWORD="" cosign import-key-pair --key source.key
          )

          for iso in "$ISO_UPLOAD_DIR"/*.iso; do
            COSIGN_PASSWORD="" cosign sign-blob -y \
              --key "${key_dir}/import-cosign.key" \
              "$iso" \
              --output-signature "${iso}.sig"
          done

      - name: Upload ISO, checksum, and signature
        if: ${{ always() && steps.artifact.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazzite-t740-e9173-polaris-installer-amd64
          path: ${{ steps.artifact.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
